<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Little Prince — Fan-Made Book Trailer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div class="stage">
      <canvas id="screen" width="1280" height="720"></canvas>
      <div id="start-overlay">
        <button id="start">▶ Play trailer</button>
      </div>
    </div>

    <div class="controls">
      <button id="play">Pause</button>
      <button id="restart">Restart</button>
      <button id="record">● Record WebM</button>
      <input id="seek" type="range" min="0" max="1000" value="0" />
      <span id="time">0:00</span>
    </div>

    <p class="note">
      Unofficial fan project. Not affiliated with or endorsed by the book's publishers or rights holders.
      All artwork is drawn in code; edit <code>config.js</code> to change captions, timing and colours.
    </p>
  </main>

  <script src="config.js"></script>
  <script src="trailer.js"></script>
</body>
</html>
